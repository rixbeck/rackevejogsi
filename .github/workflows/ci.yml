name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          set -euo pipefail
          test -f index.html
          test -f courses.html
          test -f team.html
          test -f contact.html
          test -f assets/css/main.css
          test -f assets/js/main.js
          test -f assets/img/hero-bg-2.jpg
          test -f assets/img/team/kovacs_ferenc.jpg
          test -f assets/img/team/kovacs_nora.jpg

      - name: Basic HTML sanity check
        run: |
          set -euo pipefail
          for page in index.html courses.html team.html contact.html; do
            grep -q "<title>" "$page"
          done
          grep -q "assets/img/hero-bg-2.jpg" index.html
